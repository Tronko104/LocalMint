name: Build Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Assets
        run: npm run build

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant Execute Permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Release Artifact
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/LocalMint-Chess.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LocalMint-Chess-apk
          path: release-apk/LocalMint-Chess.apk
          retention-days: 30

      - name: Publish or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Updating existing release $TAG..."
            gh release upload "$TAG" release-apk/LocalMint-Chess.apk --clobber
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" release-apk/LocalMint-Chess.apk \
              --title "LocalMint Chess v1.0.0 (Android APK)" \
              --notes "### 🌱 LocalMint Chess v1.0.0

Scarica direttamente il file **LocalMint-Chess.apk** per installarlo sul tuo dispositivo Android.

- **Motore Stockfish 19 NNUE Offline:** esecuzione al 100% in locale senza abbonamenti.
- **Game Review stile Chess.com:** precisione % e badge per ogni mossa (Brillante, Migliore, Blunder).
- **Import da Chess.com:** scarica le partite dal tuo account con un tocco via API.
- **Allenatore Puzzle:** oltre 100 problemi tattici con Elo progressivo.
- **Bot a Elo Scalabile:** da Martin 250 a Stockfish 3200+."
          fi
